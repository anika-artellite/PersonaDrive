# Axis indices for the pygame/SDL joystick path in human_agent.py.
#
# This is the FALLBACK input path. It is used only when the raw-HID reader in
# wheel_hidraw.py cannot open the wheel; on a kernel where hid-generic misparses the
# G923 descriptor these axes are dead and the agent rejects them automatically.
#
# One section per wheel model, named after the device. The first section is used, so
# swapping wheels means editing this file only. Find the indices for your device with
# tools/calibrate_wheel.py.

[Logitech G923 Racing Wheel for PlayStation and PC]
steering_wheel = 0
throttle = 2
brake = 1
clutch = 3
reverse = 4
handbrake = 5
